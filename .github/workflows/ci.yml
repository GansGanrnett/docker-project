name: CI/CD Pipeline

on:
  push:
    branches:
      - project
  pull_request:
    branches:
      - project

env:
  REGISTRY: docker.io/${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # 0. ИЗМЕНЕНИЯ (Определяем, что поменялось)
  # ==========================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      services: ${{ steps.filter.outputs.services }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
            infrastructure:
              - 'infrastructure/**'
            services:
              - 'services/**'
            scripts:
              - 'scripts/**'
              - 'docker-compose.yml'

  # ==========================================
  # 1. ВАЛИДАЦИЯ КОНТРАКТОВ (shared)
  # ==========================================
  validate-contracts:
    name: Validate OpenAPI & Protobuf
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install openapi-generator
        run: |
          npm install -g @openapitools/openapi-generator-cli
          openapi-generator-cli version-manager set 7.4.0
      - name: Validate OpenAPI specs
        run: |
          shopt -s nullglob
          for f in shared/api-contracts/openapi/*.yaml; do
            echo "Validating OpenAPI file: $f"
            openapi-generator-cli validate -i "$f"
          done
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Proto syntax
        run: |
          shopt -s nullglob
          for f in shared/api-contracts/*.proto; do
            echo "Checking Proto syntax: $f"
            protoc --proto_path=shared/api-contracts --descriptor_set_out=/dev/null "$f"
          done

  # ==========================================
  # 2. ЛИНТИНГ ИНФРАСТРУКТУРЫ
  # ==========================================
  lint-infrastructure:
    name: Lint Helm & K8s manifests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm charts
        run: |
          shopt -s nullglob
          for chart in infrastructure/kubernetes/helm-charts/*; do
            if [ -d "$chart" ]; then
              echo "Linting chart: $chart"
              helm lint "$chart"
            fi
          done
      - name: Validate Kubernetes manifests (Kube-linter)
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: infrastructure/kubernetes/base/

  # ==========================================
  # 3. СБОРКА И ПУБЛИКАЦИЯ СЕРВИСОВ (Специфика Полиглота)
  # ==========================================
  build-services:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.services == 'true' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Строго ваши папки из репозитория
        service:
          - auth-service          # Java (Maven / pom.xml)
          - catalog-service       # Go (go.mod)
          - cart-service          # Node.js (package.json)
          - order-service         # .NET (OrderService.csproj)
          - payment-service       # Python (requirements.txt)
          - analytics-service     # Python (requirements.txt)
          - api-gateway           # Node.js (package.json)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ github.ref == 'refs/heads/project' && format('{0}/{1}:latest', env.REGISTRY, matrix.service) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 4. ПРОВЕРКА СКРИПТОВ
  # ==========================================
  check-scripts:
    name: Validate automation scripts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
