name: CI/CD Pipeline

on:
  push:
    branches:
      - project
      - main
  pull_request:
    branches:
      - project
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Secret & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        with:
          config: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Scan for hardcoded credentials
        run: |
          if grep -rE --include='*.py' --include='*.js' --include='*.java' --include='*.cs' \
            -e 'Prod[A-Za-z]+Pass[0-9A-Za-z]+' \
            -e 'amqp://[a-zA-Z0-9_]+:[a-zA-Z0-9_]+@' \
            -e 'mongodb(\+srv)?://[a-zA-Z0-9_]+:[^@${]+@' \
            -e 'redis://:[a-zA-Z0-9_]+@' \
            -e 'postgres://[a-zA-Z0-9_]+:[^@${]+@' \
            -e 'password\s*[:=]\s*["'"'"'][^"'"'"'\$]' \
            -E services/ shared/ scripts/; then
            echo "::error::Hardcoded credentials found in source code"
            exit 1
          fi
          echo "No hardcoded credentials detected."

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      services: ${{ steps.filter.outputs.services }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
            infrastructure:
              - 'infrastructure/**'
            services:
              - 'services/**'
            scripts:
              - 'scripts/**'
              - 'docker-compose.yml'

  validate-contracts:
    name: Validate OpenAPI & Protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.shared == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install openapi-generator
        run: |
          npm install -g @openapitools/openapi-generator-cli
          openapi-generator-cli version-manager set 7.4.0
      - name: Validate OpenAPI specs
        run: |
          shopt -s nullglob
          for f in shared/api-contracts/openapi/*.yaml; do
            openapi-generator-cli validate -i "$f"
          done
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Proto syntax
        run: |
          shopt -s nullglob
          for f in shared/api-contracts/*.proto; do
            protoc --proto_path=shared/api-contracts --descriptor_set_out=/dev/null "$f"
          done

  lint-infrastructure:
    name: Lint Helm & K8s manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
      - name: Lint Helm charts
        run: |
          shopt -s nullglob
          for chart in infrastructure/kubernetes/helm-charts/*; do
            if [ -d "$chart" ]; then
              helm lint "$chart"
            fi
          done
      - name: Validate K8s base manifests
        # helm lint выше проверяет только чарты, поэтому манифесты из base/
        # (StatefulSet, Service, ConfigMap, Secret) валидируются отдельно
        # против схем Kubernetes. Без этого шага опечатки в spec проходили
        # незамеченными: volumes на уровне spec вместо spec.template.spec.
        run: |
          docker run --rm \
            -v "$PWD/infrastructure/kubernetes:/repo:ro" \
            -w /repo \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary -kubernetes-version 1.29.0 \
            -ignore-filename-pattern 'values\.yaml$' \
            base

  build-services:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.services == 'true' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - catalog-service
          - cart-service
          - order-service
          - payment-service
          - api-gateway
          - analytics-service
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert image name to lowercase
        id: string
        run: echo "IMAGE_ID=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.string.outputs.IMAGE_ID }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ github.ref == 'refs/heads/project' && format('{0}/{1}/{2}:latest', env.REGISTRY, steps.string.outputs.IMAGE_ID, matrix.service) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.services == 'true' || github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - catalog-service
          - cart-service
          - order-service
          - payment-service
          - api-gateway
          - analytics-service
    steps:
      - uses: actions/checkout@v7.0.1

      # Собираем образ локально: сканируем финальный артефакт, а не исходники.
      # Интересуют CVE в базовом слое и в зависимостях, попавших в image.
      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            --tag "local/${{ matrix.service }}:scan" \
            ./services/${{ matrix.service }}

      # Гейт по CRITICAL. HIGH сейчас не блокирует: на момент включения
      # сканирования в базовых образах было 147 HIGH (Go 1.21, Node 20,
      # Alpine 3.19, Python 3.10) и любая блокировка валила бы каждый PR.
      # Долг по HIGH вынесен в дорожную карту; известные CRITICAL закрыты
      # baseline'ом .trivyignore, новые - роняют сборку.
      - name: Scan ${{ matrix.service }} with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'

  run-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.services == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.21'

      - name: Go build & test (catalog-service)
        working-directory: services/catalog-service
        run: |
          go vet ./...
          go test ./...

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          pip install pytest==8.0.0
          pip install -r services/payment-service/requirements.txt
          pip install -r services/analytics-service/requirements.txt

      - name: Test payment-service
        working-directory: services/payment-service
        run: python -m pytest tests/ -v

      - name: Test analytics-service
        working-directory: services/analytics-service
        run: python -m pytest tests/ -v

      - name: Set up MongoDB
        # Сервис для интеграционных тестов order-service. Версия 6 совпадает
        # с той, что в docker-compose.yml и в helm-чарте: тесты не должны
        # проходить на движке, которого нет в продакшене.
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: 6.0

      - name: Build order-service (.NET)
        working-directory: services/order-service
        run: dotnet build --nologo --verbosity quiet

      - name: Test order-service (.NET)
        working-directory: services/order-service
        env:
          TEST_MONGO_URL: mongodb://localhost:27017
        run: |
          set -euo pipefail

          dotnet test tests/OrderService.Tests/OrderService.Tests.csproj \
            --no-build --nologo \
            --logger "trx;LogFileName=order-tests.trx" \
            --results-directory "$RUNNER_TEMP/testresults"

          # Тесты, которым нужна MongoDB, пропускаются, если сервис не поднялся.
          # Молчаливый пропуск опаснее падения: зелёная сборка выглядела бы как
          # успех, хотя переходы статусов никто не проверил. Поэтому при
          # недоступной базе шаг падает явно.
          trx="$RUNNER_TEMP/testresults/order-tests.trx"
          skipped="$(grep -o '<UnitTestResult[^>]*outcome="NotExecuted"' "$trx" | wc -l || true)"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped тестов пропущено, хотя MongoDB должна была быть доступна"
            grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' "$trx" | sed 's/^/  /' || true
            exit 1
          fi
          echo "все тесты order-service выполнены, пропусков нет"

  check-scripts:
    name: Validate automation scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
      - name: Run ShellCheck on chart-embedded scripts
        # Канонический генератор ключей лежит внутри чарта, потому что Helm
        # не читает файлы за пределами каталога чарта, а hook-job монтирует
        # именно его в ConfigMap. Без этого шага он не проверялся бы вовсе.
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './infrastructure/kubernetes/helm-charts/auth-service/files'
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  check-jwt-keys:
    name: Verify JWT key bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      needs.changes.outputs.infrastructure == 'true' ||
      needs.changes.outputs.services == 'true' ||
      needs.changes.outputs.scripts == 'true' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Приватный ключ не отслеживается git
        # private.pem лежит в .gitignore, но правило можно случайно сломать
        # удалением строки. Тогда ключ уедет в историю - и оттуда его уже не
        # вычистить без rewrite, поэтому ловим это на CI, а не в gitleaks.
        run: |
          set -euo pipefail
          if git ls-files | grep -qE '(^|/)private\.pem$'; then
            echo "::error::private.pem отслеживается git - приватный ключ попадёт в историю"
            exit 1
          fi
          echo "private.pem не отслеживается"

      - name: Генератор выдаёт валидную пару и не перевыпускает ключи
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          scripts/generate-jwt-keys.sh "$tmp"

          # Повторный запуск обязан быть no-op. Если он перевыпустит ключи,
          # то при каждом деплое будут инвалидироваться все выпущенные токены -
          # самый дорогой способ сломать аутентификацию.
          before="$(sha256sum "$tmp/private.pem")"
          scripts/generate-jwt-keys.sh "$tmp"
          after="$(sha256sum "$tmp/private.pem")"
          if [ "$before" != "$after" ]; then
            echo "::error::повторный запуск перевыпустил private.pem"
            exit 1
          fi

          scripts/generate-jwt-keys.sh --check "$tmp"
          echo "пара ключей валидна и генерируется один раз"

      - name: Реализация генератора ровно одна
        # Логика генерации обязана жить в единственном файле. Вторая копия
        # разъедется с первой, и расхождение всплывёт только в кластере:
        # локально разработчик запускал бы исправленный скрипт, а hook-job -
        # устаревший. Поэтому проверяем не содержимое, а количество носителей
        # самой генерации.
        run: |
          set -euo pipefail
          # .github исключён намеренно: этот же шаг цитирует 'openssl genpkey'
          # в комментарии и в проверке, и без исключения нашёл бы сам себя.
          holders="$(grep -rl --exclude-dir=.git --exclude-dir=.github 'openssl genpkey' . | sort)"
          count="$(printf '%s\n' "$holders" | grep -c . || true)"
          echo "openssl genpkey встречается в:"
          printf '%s\n' "$holders" | sed 's/^/  /'

          expected='infrastructure/kubernetes/helm-charts/auth-service/files/generate-jwt-keys.sh'
          if [ "$count" -ne 1 ]; then
            echo "::error::генерация ключа продублирована в $count файлах - оставить можно только $expected"
            exit 1
          fi
          if [ "$holders" != "./$expected" ]; then
            echo "::error::генерация переехала в $holders, а чарт читает $expected"
            exit 1
          fi

      - name: Скрипт реально попадает в ConfigMap
        # .Files.Get не ходит за пределы каталога чарта: опечатка в пути даёт
        # пустой ConfigMap, hook-job падает с "no such file", и это видно
        # только при развёртывании.
        run: |
          set -euo pipefail
          pip install --quiet pyyaml

          rendered="$(mktemp)"
          helm template auth infrastructure/kubernetes/helm-charts/auth-service > "$rendered"

          # Дефис перед именем файла обязателен: без него python3 попытался бы
          # исполнить YAML как Python-скрипт, а не прочитать его как аргумент.
          python3 - "$rendered" <<'PY'
          import sys
          import yaml

          embedded = None
          with open(sys.argv[1], encoding="utf-8") as fh:
              for doc in yaml.safe_load_all(fh):
                  if doc and doc.get("kind") == "ConfigMap":
                      data = doc.get("data") or {}
                      if "generate-jwt-keys.sh" in data:
                          embedded = data["generate-jwt-keys.sh"]
                          break

          if not embedded:
              sys.exit("::error::ConfigMap со скриптом не найден в рендере чарта")
          if "openssl genpkey" not in embedded:
              sys.exit("::error::в ConfigMap попал не тот файл")

          canon = ("infrastructure/kubernetes/helm-charts/auth-service"
                   "/files/generate-jwt-keys.sh")
          with open(canon, encoding="utf-8") as fh:
              source = fh.read()

          # Блочный скаляр YAML добивляет ровно один перевод строки в конце,
          # поэтому сверяем без хвостовых - иначе сравнение врёт всегда.
          if embedded.rstrip("\n") != source.rstrip("\n"):
              sys.exit("::error::ConfigMap не собран из канонического скрипта")
          PY

          echo "скрипт в ConfigMap идентичен каноническому"

