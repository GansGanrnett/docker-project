name: CI/CD Pipeline

on:
  push:
    branches:
      - project
      - infrastructure
      - scripts
      - services
      - shared
  pull_request:
    branches:
      - project

env:
  REGISTRY: docker.io/${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================
  # 1. Валидация контрактов (shared)
  # ============================
  validate-contracts:
    name: Validate OpenAPI & Protobuf
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'shared/') ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install openapi-generator
        run: npm install -g @openapitools/openapi-generator-cli
      - name: Validate OpenAPI specs
        run: |
          for f in shared/api-contracts/openapi/*.yaml; do
            openapi-generator-cli validate -i $f
          done
      - name: Install protoc
        uses: arduino/setup-protoc@v2
      - name: Generate code from proto (check syntax)
        run: |
          for f in shared/api-contracts/*.proto; do
            protoc --proto_path=shared/api-contracts --descriptor_set_out=/dev/null $f
          done

  # ============================
  # 2. Линтинг инфраструктуры
  # ============================
  lint-infrastructure:
    name: Lint Helm & K8s manifests
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v3
      - name: Lint Helm charts
        run: |
          for chart in infrastructure/kubernetes/helm-charts/*; do
            helm lint $chart
          done
      - name: Validate Kubernetes manifests (kubeval)
        uses: instrumenta/kubeval-action@v2
        with:
          files: infrastructure/kubernetes/base/

  # ============================
  # 3. Сборка и публикация Docker-образов для сервисов
  # ============================
  build-services:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: [validate-contracts]
    # Запускаем только при изменении services/ или api-gateway
    if: |
      contains(github.event.head_commit.modified, 'services/') ||
      contains(github.event.head_commit.modified, 'api-gateway') ||
      github.event_name == 'pull_request'
    strategy:
      matrix:
        service:
          - auth-service
          - catalog-service
          - cart-service
          - order-service
          - payment-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        # Если используете ECR, замените на aws-actions/amazon-ecr-login

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ github.ref == 'refs/heads/project' && format('{0}/{1}:latest', env.REGISTRY, matrix.service) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================
  # 4. Проверка скриптов (лёгкая)
  # ============================
  check-scripts:
    name: Validate automation scripts
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'scripts/') ||
      contains(github.event.head_commit.modified, 'docker-compose.yml')
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          find scripts/ -name "*.sh" -exec shellcheck {} +
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ============================
  # 5. (Опционально) Деплой через ArgoCD при пуше в project
  # ============================
  deploy:
    name: Trigger ArgoCD sync
    runs-on: ubuntu-latest
    needs: [build-services, check-scripts]
    if: github.ref == 'refs/heads/project' && github.event_name == 'push'
    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
      - name: Sync ArgoCD application
        env:
          ARGO_SERVER: ${{ secrets.ARGO_SERVER }}
          ARGO_TOKEN: ${{ secrets.ARGO_TOKEN }}
        run: |
          argocd app sync ecommerce-app \
            --server $ARGO_SERVER \
            --auth-token $ARGO_TOKEN \
            --prune
