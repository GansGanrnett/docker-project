# Network Policies для манифестов из base/.
#
# Покрыта каждая нагрузка из этого каталога. Логика простая: под попадает под
# политику - весь ingress, кроме перечисленного, закрыт. Поэтому глобальный
# default-deny здесь не нужен и не добавляется: пока не у всех подов в кластере
# есть политика, он рискует обрезать легитимный трафик (например, подов
# system-пространств имен).
#
# ВАЖНО про проверку: политики применяются только сетевым плагином, который
# их поддерживает. Проверено на kind v0.33.0 с kindnet - ограничения
# работают и там: под с меткой app=backup соединяется с auth-postgres, под
# без этой метки зависает на том же порту. Раньше здесь стояло утверждение,
# что kindnet NetworkPolicy игнорирует, - оно неверно для этой версии.
# Изоляция проверена также на kind с Calico v3.28.2 пятью замерами с
# подов-зондов, несущих метки чартов: разрешённые пары соединяются, чужие
# блокируются.
#
# Клиенты адресуются по меткам, которые задают helm-чарты:
#   app.kubernetes.io/name=<service>, app.kubernetes.io/instance=<Release.Name>
# Зависит только от app.kubernetes.io/name, чтобы политика пережила
# переустановку релиза с другим именем.
#
# Предполагается, что приложения тоже работают в кластере: разрешённые
# клиенты - это поды. Если сервисы запущены на хосте (docker-compose),
# сетевой плагин может срезать их обращения к базам. Для связки "приложения
# в docker-compose, только базы в k8s" эти политики применять нельзя.
#
# Случай валидации (validation-pod) закрыт полностью: команда `echo validation`
# сети не требует.

# --- Базы данных: доступ только у своего сервиса
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-postgres-policy
spec:
  podSelector:
    matchLabels:
      app: auth-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
        # backup-postgres CronJob cнимает дампы с того же PVC - без этого
        # правила ночной backup умирает на connect timeout.
        - podSelector:
            matchLabels:
              app: backup
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Только DNS: наружу auth-postgres не ходит. Ответы на уже разрешённый
    # входящий коннект (в т.ч. от backup-пода) egress-правилами не режутся.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-postgres-policy
spec:
  podSelector:
    matchLabels:
