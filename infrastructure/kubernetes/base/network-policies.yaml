        - podSelector:
            matchLabels:
              app: backup
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Только DNS: наружу payment-postgres не ходит.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-mongodb-policy
spec:
  podSelector:
    matchLabels:
