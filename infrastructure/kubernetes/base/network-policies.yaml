        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-service
        # backup-postgres CronJob: снимает дампы с того же PVC.
        - podSelector:
            matchLabels:
              app: backup
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
