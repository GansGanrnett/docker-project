# --- Брокер: AMQP от трёх потребителей, management UI - только от мониторинга
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: message-rabbitmq-policy
spec:
  podSelector:
    matchLabels:
      app: message-rabbitmq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # AMQP 5672: order-service (публикация), payment-service и
    # analytics-service (потребление).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: analytics-service
      ports:
        - protocol: TCP
          port: 5672
    # Management UI 15672: сегодня в namespace нет ни одного пода с такой
    # меткой, то есть UI недоступен изнутри кластера. Когда Prometheus и
    # Grafana переедут из docker-compose в k8s, им ставится метка
    # monitoring=true - и правило начнёт работать без правок.
    - from:
        - podSelector:
            matchLabels:
              monitoring: "true"
      ports:
        - protocol: TCP
          port: 15672
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# --- Служебный под: сеть не нужна полностью
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: validation-pod-policy
spec:
  podSelector:
    matchLabels:
      app: validation
  policyTypes:
    - Ingress
    - Egress
  # Пустые списки ingress/egress означают «запрещено всё».
