apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: analytics-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: RABBITMQ_URL
              value: "amqp://admin:ProdRabbitBrokerPass2026Secure99@message-rabbitmq-service:5672"
