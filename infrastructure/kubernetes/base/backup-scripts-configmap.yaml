# GENERATED FILE - do not edit by hand.
# Source: infrastructure/kubernetes/scripts/{backup-databases.sh,restore-database.sh}
# Regenerate with: infrastructure/kubernetes/scripts/render-backup-configmap.sh
#
# Both CronJobs in backup-cronjob.yaml mount this ConfigMap read-only, so the
# backup and restore logic that runs in the cluster is byte-identical to the
# version under version control.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: default
data:
  backup-databases.sh: |
    #!/usr/bin/env bash
    #
    # backup-databases.sh - dump the stateful workloads of the single-node cluster.
    #
    # Called from the two CronJobs in base/backup-cronjob.yaml:
    #   backup-postgres  -> postgres:15-alpine, mode "postgres"
    #   backup-mongodb   -> mongo:6.0,          mode "mongodb"
    #
    # One script for both images so the layout, the retention rule and the
    # verification logic exist in exactly one place. Each mode only touches the
    # tooling its image actually has.
    #
    # Output layout on the backups PVC:
    #   /backups/<target>/<UTC timestamp>/
    #       <file>.dump            pg_dump -Fc archive
    #       order_db/*.bson        mongodump directory (per-collection payloads)
    #       manifest.txt           sha256, size, verification result
    #
    # A backup that was never restored is not a backup, so every archive is verified
    # before it is recorded as OK: pg_restore --list must parse the archive and report
    # entries, and a mongodump directory must contain the metadata.json that
    # mongodump writes on completion. A failing target makes the script exit non-zero
    # so the CronJob shows it instead of quietly producing nothing.
    #
    # Image capabilities this script relies on (verified against both images):
    #   postgres:15-alpine  bash, sha256sum, pg_dump, pg_restore
    #   mongo:6.0           bash, sha256sum, mongodump, mongorestore
    # Note that mongo:6.0 has no `nc`, so readiness is probed over bash's own
    # /dev/tcp rather than shelling out to netcat.
    set -euo pipefail

    BACKUP_ROOT="${BACKUP_ROOT:-/backups}"
    RETENTION="${RETENTION:-7}"
    MODE="${1:-all}"

    log()   { printf '%s\n' "  $*"; }
    red()   { printf '\033[31m%s\033[0m\n' "$*"; }
    green() { printf '\033[32m%s\033[0m\n' "$*"; }

    # --- configuration -----------------------------------------------------------
    # Credentials are injected from the app-secrets Secret, never passed on the
    # command line: an argument is visible in `ps` to every container in the pod.
    : "${AUTH_DB_HOST:=auth-postgres-service}"
    : "${AUTH_DB_PORT:=5432}"
    : "${AUTH_DB_NAME:=auth_db}"
    : "${CATALOG_DB_HOST:=catalog-postgres-service}"
    : "${CATALOG_DB_PORT:=5432}"
    : "${CATALOG_DB_NAME:=catalog_db}"
    : "${MONGO_HOST:=order-mongodb-service}"
    : "${MONGO_PORT:=27017}"
    # Scoped to the application database. A full-server dump would also capture the
    # admin/system databases, which mongorestore --drop then refuses to recreate -
    # turning a routine restore into a failure at the last step.
    : "${MONGO_DB:=order_db}"

    export PGPASSFILE=/dev/null

    fail=0

    timestamp() { date -u +%Y%m%dT%H%M%SZ; }

    # Each mode is validated only for the credentials it actually uses. The mongodb
    # CronJob intentionally ships no PostgreSQL secrets, so validating all of them up
    # front would abort that job before it touched anything.
    require_pg_credentials() {
      local name value missing=""
      for name in AUTH_DB_USER AUTH_DB_PASSWORD CATALOG_DB_USER CATALOG_DB_PASSWORD; do
        eval "value=\${$name:-}"
        [ -n "$value" ] || missing="$missing $name"
      done
      if [ -n "$missing" ]; then
        red "missing required environment for mode '$MODE':$missing"
        exit 1
      fi
    }

    # Waits for a TCP listener. A CronJob pod is scheduled independently of the
    # database pods, so "the host is in DNS" does not mean "postgres is accepting
    # connections yet" - without this the first scheduled run of the day fails
    # whenever the databases happen to be restarting. Uses bash's /dev/tcp so the
    # script needs no netcat, which mongo:6.0 does not ship.
    tcp_wait() {
      local host="$1" port="$2" label="$3" _
      for _ in $(seq 1 30); do
        # The subshell owns fd 3 and closes it on exit, so no descriptor leaks.
        if (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null; then
          return 0
        fi
        sleep 2
      done
      red "    $label: $host:$port did not accept connections within 60s"
      return 1
    }

    # A directory counts as usable only if its manifest says so. Failed runs leave
    # their directory behind on purpose - the FAILED manifest is the only forensic
    # record of what went wrong - so "newest directory" and "newest good backup" are
    # not the same thing.
    is_verified() {
      local manifest="$1/manifest.txt"
      [ -f "$manifest" ] && grep -qx 'verified=OK' "$manifest"
    }

    write_manifest() {
      local dir="$1" target="$2" result="$3" database="$4" file
      {
        echo "target=$target"
        echo "database=$database"
        echo "timestamp=$(basename "$dir")"
        echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "mode=$MODE"
        echo "verified=$result"
        echo "--- sha256 ---"
        # Hash every payload file, not just *.dump. A mongodump directory is a set of
        # .bson files plus metadata.json, and an un-hashed .bson is exactly what a
        # truncated write on a full disk damages.
        while IFS= read -r file; do
          sha256sum "$file"
        done < <(find "$dir" -type f ! -name manifest.txt | sort)
      } > "$dir/manifest.txt"
    }

    # Keeps the newest $RETENTION *verified* backups of a target and deletes the rest.
    # Counting failed directories toward the limit would let a target that keeps
    # failing slowly push its last good backups off the PVC, which is the opposite
    # of what retention is for.
    apply_retention() {
      local target="$1" keep="$2" dir cutoff
      local -a verified=()
      while IFS= read -r dir; do
        is_verified "$dir" && verified+=("$dir")
      done < <(find "$BACKUP_ROOT/$target" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -r)

      if [ "${#verified[@]}" -le "$keep" ]; then
        return 0
      fi

      # Delete everything strictly older than the oldest backup still being retained.
      # That reclaims the FAILED directories too, without ever pruning a good one.
      # The comparison must be strict: the retained one is included in the window, so
      # '<=' would delete the oldest surviving backup as well and keep RETENTION-1
      # good copies (with RETENTION=1 that empties the target completely).
      cutoff="${verified[$((keep - 1))]}"
      while IFS= read -r dir; do
        log "    pruning ${dir##*/}"
        rm -rf "$dir"
      done < <(find "$BACKUP_ROOT/$target" -mindepth 1 -maxdepth 1 -type d | sort -r | awk -v c="$cutoff" '$0 < c')
    }

    backup_postgres_target() {
      local label="$1" host="$2" port="$3" db="$4" user="$5" password="$6"
      local ts dir archive entries

      # Exported so pg_dump inherits it; a CLI flag would expose it in `ps`.
      export PGPASSWORD="$password"
      ts="$(timestamp)"
      dir="$BACKUP_ROOT/$label/$ts"
      archive="$dir/$label-$ts.dump"
      mkdir -p "$dir"

      log "$label: dumping $db@$host:$port"
      if ! tcp_wait "$host" "$port" "$label"; then
        fail=1
        return
      fi

      if ! pg_dump -Fc -h "$host" -p "$port" -U "$user" -d "$db" -f "$archive"; then
        red "    $label: pg_dump failed"
        fail=1
        return
      fi

      # Verification: pg_restore --list parses the custom-format archive and prints
      # its table of contents. It fails on a truncated or corrupt file, which is
      # exactly the failure mode that makes a backup useless.
      if entries="$(pg_restore --list "$archive" 2>/dev/null)" && [ -n "$entries" ]; then
        green "    $label: archive verified ($(printf '%s\n' "$entries" | wc -l) entries)"
      else
        red "    $label: archive is NOT restorable"
        fail=1
        write_manifest "$dir" "$label" "FAILED" "$db"
        return
      fi

      write_manifest "$dir" "$label" "OK" "$db"
      apply_retention "$label" "$RETENTION"
    }

    backup_mongodb() {
      local ts dir bson dryrun

      ts="$(timestamp)"
      dir="$BACKUP_ROOT/mongodb/$ts"
      mkdir -p "$dir"

      log "mongodb: dumping db=$MONGO_DB from $MONGO_HOST:$MONGO_PORT"
      # No credentials: the order-mongodb Deployment runs without --auth, so there is
      # nothing to authenticate with. If auth is ever enabled, pass the URI via an
      # environment variable built from the Secret - never as a CLI argument, which
      # every other container in the pod can read from `ps`.
      if ! tcp_wait "$MONGO_HOST" "$MONGO_PORT" mongodb; then
        fail=1
        return
      fi

      if ! mongodump --host "$MONGO_HOST" --port "$MONGO_PORT" --db "$MONGO_DB" --out "$dir"; then
        red "    mongodb: mongodump failed"
        fail=1
        return
      fi

      # Verification, in two steps. mongodump's exit status alone is not enough: a
      # dump with no collections produces no files at all (verified against
      # mongo:6.0 - not even an empty directory), so "the command succeeded" and
      # "there is something to restore" are different questions.
      #
      # 1. At least one collection must have been written. A zero-collection dump is
      #    recorded as OK but loudly, because the usual cause is a typo in MONGO_DB,
      #    and a wrong database name would otherwise back up nothing every night.
      bson="$(find "$dir" -name '*.bson' -type f | wc -l)"
      if [ "$bson" -gt 0 ]; then
        # 2. mongorestore --dryRun parses the dump exactly the way a real restore
        #    would and reports what it would do without touching the server. This is
        #    the mongo equivalent of pg_restore --list: it fails on a truncated or
        #    corrupt .bson, which is the failure mode that makes a backup useless.
        #    --nsInclude keeps the dry run inside the namespace that was dumped.
        if dryrun="$(mongorestore --dryRun --nsInclude "$MONGO_DB.*" \
                                    --host "$MONGO_HOST" --port "$MONGO_PORT" "$dir" 2>&1)" &&
           printf '%s' "$dryrun" | grep -q 'dry run completed'; then
          green "    mongodb: archive verified ($bson bson files, dry run clean)"
        else
          red "    mongodb: archive is NOT restorable"
          printf '%s\n' "$dryrun" | tail -5 | while IFS= read -r line; do red "      $line"; done
          fail=1
          write_manifest "$dir" mongodb "FAILED" "$MONGO_DB"
          return
        fi
      else
        green "    mongodb: dump OK but empty (0 collections in $MONGO_DB)"
      fi

      write_manifest "$dir" mongodb "OK" "$MONGO_DB"
      apply_retention mongodb "$RETENTION"
    }

    case "$MODE" in
      postgres)
        require_pg_credentials
        backup_postgres_target auth-postgres    "$AUTH_DB_HOST"    "$AUTH_DB_PORT"    "$AUTH_DB_NAME"    "$AUTH_DB_USER"    "$AUTH_DB_PASSWORD"
        backup_postgres_target catalog-postgres "$CATALOG_DB_HOST" "$CATALOG_DB_PORT" "$CATALOG_DB_NAME" "$CATALOG_DB_USER" "$CATALOG_DB_PASSWORD"
        ;;
      mongodb)
        backup_mongodb
        ;;
      all)
        require_pg_credentials
        backup_postgres_target auth-postgres    "$AUTH_DB_HOST"    "$AUTH_DB_PORT"    "$AUTH_DB_NAME"    "$AUTH_DB_USER"    "$AUTH_DB_PASSWORD"
        backup_postgres_target catalog-postgres "$CATALOG_DB_HOST" "$CATALOG_DB_PORT" "$CATALOG_DB_NAME" "$CATALOG_DB_USER" "$CATALOG_DB_PASSWORD"
        backup_mongodb
        ;;
      *)
        red "unknown mode: $MODE (expected postgres, mongodb or all)"
        exit 2
        ;;
    esac

    if [ "$fail" -ne 0 ]; then
      red "BACKUP FAILED"
      exit 1
    fi
    green "BACKUP OK"

  restore-database.sh: |
    #!/usr/bin/env bash
    #
    # restore-database.sh - restore a database from a verified backup.
    #
    #   restore-database.sh postgres   [--target TIMESTAMP] [--yes]
    #   restore-database.sh mongodb    [--target TIMESTAMP] [--yes]
    #
    # This is the other half of backup-databases.sh and it is deliberately hard to
    # run by accident: a restore replaces the live contents of the database, and the
    # most common way to lose data is a restore that was fired without thinking about
    # which archive it would pick. So the script prints the archive it resolved, the
    # manifest status and the target database, and refuses to touch anything without
    # an explicit --yes.
    #
    # The archive checksums recorded by the backup script are re-verified before use,
    # so a truncated file on the PVC is reported instead of being half-applied.
    #
    # Image capabilities this script relies on (verified against both images):
    #   postgres:15-alpine  bash, sha256sum, pg_restore
    #   mongo:6.0           bash, sha256sum, mongorestore
    # Note that mongo:6.0 has no `nc`, so readiness is probed over bash's own
    # /dev/tcp rather than shelling out to netcat.
    set -euo pipefail

    BACKUP_ROOT="${BACKUP_ROOT:-/backups}"

    # log/red write to stderr on purpose. resolve_dir() and the per-target lookups
    # run inside command substitutions, where stdout is captured as the returned
    # value - anything printed there would be swallowed into the variable and the
    # operator would never see why the restore stopped. stderr is not captured, so
    # the diagnostic always reaches the pod log.
    log()   { printf '%s\n' "  $*" >&2; }
    red()   { printf '\033[31m%s\033[0m\n' "$*" >&2; }
    green() { printf '\033[32m%s\033[0m\n' "$*"; }

    usage() {
      red "usage: restore-database.sh <postgres|mongodb> [--target TIMESTAMP] [--yes]"
      exit 2
    }

    # The mode is positional and comes first, so it is read before option parsing -
    # otherwise the loop below consumes it and every invocation ends in "usage".
    MODE="${1:-}"
    [ $# -gt 0 ] && shift
    [ -n "$MODE" ] || usage

    target_ts=""
    assume_yes=0
    while [ $# -gt 0 ]; do
      case "$1" in
        --target)
          target_ts="${2:-}"
          [ -n "$target_ts" ] || { red "--target requires a timestamp"; exit 2; }
          shift 2
          ;;
        --yes|-y) assume_yes=1; shift ;;
        -h|--help) usage ;;
        *) red "unknown argument: $1"; usage ;;
      esac
    done

    # --- configuration -----------------------------------------------------------
    : "${AUTH_DB_HOST:=auth-postgres-service}"
    : "${AUTH_DB_PORT:=5432}"
    : "${AUTH_DB_NAME:=auth_db}"
    : "${CATALOG_DB_HOST:=catalog-postgres-service}"
    : "${CATALOG_DB_PORT:=5432}"
    : "${CATALOG_DB_NAME:=catalog_db}"
    : "${MONGO_HOST:=order-mongodb-service}"
    : "${MONGO_PORT:=27017}"
    : "${MONGO_DB:=order_db}"

    export PGPASSFILE=/dev/null

    # Only the credentials the selected mode actually uses are required, matching how
    # backup-databases.sh validates: a mongodb restore must not fail because no
    # PostgreSQL secret was mounted into the Job.
    require_pg_credentials() {
      local name value missing=""
      for name in AUTH_DB_USER AUTH_DB_PASSWORD CATALOG_DB_USER CATALOG_DB_PASSWORD; do
        eval "value=\${$name:-}"
        [ -n "$value" ] || missing="$missing $name"
      done
      if [ -n "$missing" ]; then
        red "missing required environment for mode '$MODE':$missing"
        exit 1
      fi
    }

    # Uses bash's /dev/tcp so the script needs no netcat, which mongo:6.0 lacks.
    tcp_wait() {
      local host="$1" port="$2" label="$3" _
      for _ in $(seq 1 30); do
        if (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null; then
          return 0
        fi
        sleep 2
      done
      red "$label: $host:$port did not accept connections within 60s"
      return 1
    }

    # Resolves the archive directory: the requested one, or the newest *verified*
    # backup. backup-databases.sh keeps failed directories around for forensics, so
    # "newest directory" is not the same as "newest backup that will actually restore".
    resolve_dir() {
      local target="$1" dir candidate
      if [ -n "$target_ts" ]; then
        dir="$BACKUP_ROOT/$target/$target_ts"
        [ -d "$dir" ] || { red "no backup at $dir"; exit 1; }
        printf '%s' "$dir"
        return
      fi
      while IFS= read -r candidate; do
        if [ -f "$candidate/manifest.txt" ] && grep -qx 'verified=OK' "$candidate/manifest.txt"; then
          printf '%s' "$candidate"
          return
        fi
        log "skipping ${candidate##*/} (no verified backup)"
      done < <(find "$BACKUP_ROOT/$target" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -r)
      red "no verified backups found under $BACKUP_ROOT/$target - run backup-databases.sh first"
      exit 1
    }

    # Re-verifies every checksum in the manifest. Only lines below the "--- sha256 ---"
    # marker are checksums: the metadata lines above it are not "<hash>  <file>" pairs
    # and must not be parsed as if they were. Parsing the whole file makes every
    # restore fail on the manifest's own target= line.
    check_manifest() {
      # Two separate local declarations on purpose: within one `local` statement the
      # later assignment still sees the *outer* dir, so manifest would be built from
      # the previous target's path.
      local dir="$1"
      local manifest="$dir/manifest.txt"
      if [ ! -f "$manifest" ]; then
        red "manifest missing: $manifest"
        exit 1
      fi

      local status
      status="$(sed -n 's/^verified=//p' "$manifest")"
      if [ "$status" != "OK" ]; then
        red "backup $dir is marked verified=$status - refusing to restore from it"
        exit 1
      fi

      # The PVC can hold a truncated file after a disk problem, and that is exactly
      # when someone reaches for a restore.
      local line file want got in_section=0 checked=0
      while IFS= read -r line; do
        case "$line" in
          '--- sha256 ---') in_section=1; continue ;;
        esac
        [ "$in_section" -eq 1 ] || continue
        [ -n "$line" ] || continue
        # sha256sum prints "<hash><space><space><path>".
        want="${line%% *}"
        file="${line#* }"
        file="${file# }"
        if [ ! -f "$file" ]; then
          red "archive listed in the manifest is missing: $file"
          exit 1
        fi
        got="$(sha256sum "$file" | awk '{print $1}')"
        if [ "$got" != "$want" ]; then
          red "checksum mismatch for $file"
          red "  expected $want"
          red "  actual   $got"
          exit 1
        fi
        checked=$((checked + 1))
      done < "$manifest"

      [ "$checked" -gt 0 ] || { red "manifest lists no checksums: $manifest"; exit 1; }
      log "checksum verified ($checked files)"
    }

    confirm() {
      [ "$assume_yes" -eq 1 ] && return 0
      red "REFUSING TO RUN WITHOUT --yes"
      log "this replaces the live contents of: $*"
      exit 1
    }

    case "$MODE" in
      postgres)
        require_pg_credentials
        # Two phases on purpose. Every archive is resolved and verified before
        # anything is restored, so a corrupt catalog archive cannot leave auth
        # dropped-and-empty while catalog was never touched - two half-restored
        # databases are strictly worse than not having started.
        labels=(); hosts=(); ports=(); dbs=(); users=(); pwds=(); archives=(); dirs=()
        for pair in "auth-postgres|$AUTH_DB_HOST|$AUTH_DB_PORT|$AUTH_DB_NAME|$AUTH_DB_USER|$AUTH_DB_PASSWORD" \
                    "catalog-postgres|$CATALOG_DB_HOST|$CATALOG_DB_PORT|$CATALOG_DB_NAME|$CATALOG_DB_USER|$CATALOG_DB_PASSWORD"; do
          IFS='|' read -r label host port db user password <<< "$pair"

          # `set -e` does not fire inside a command substitution, so resolve_dir's
          # `exit 1` would only end the subshell and leave $dir empty - the script
          # would then walk on with an empty path instead of stopping. The exit
          # status has to be checked explicitly.
          dir="$(resolve_dir "$label")" || { red "no usable backup for $label"; exit 1; }
          [ -n "$dir" ] || { red "resolve_dir returned an empty path for $label"; exit 1; }
          archive="$(find "$dir" -name '*.dump' -type f | head -1)"
          [ -n "$archive" ] || { red "no .dump archive in $dir"; exit 1; }

          echo "=== $label ==="
          log "archive : $archive"
          log "size    : $(wc -c < "$archive") bytes"
          log "target  : $db@$host:$port as $user"
          check_manifest "$dir"
          tcp_wait "$host" "$port" "$label" || exit 1

          labels+=("$label"); hosts+=("$host"); ports+=("$port")
          dbs+=("$db"); users+=("$user"); pwds+=("$password"); archives+=("$archive"); dirs+=("$dir")
        done

        for i in "${!labels[@]}"; do
          confirm "${dbs[$i]}@${hosts[$i]}:${ports[$i]}"
          # Exported so pg_restore inherits it; a CLI flag would expose it in `ps`.
          export PGPASSWORD="${pwds[$i]}"
          # --clean --if-exists drops the existing objects before recreating them.
          # --single-transaction keeps the restore all-or-nothing: without it a
          # failure halfway through leaves a partially dropped schema behind, which
          # is worse than the state we started from.
          if pg_restore --clean --if-exists --no-owner --single-transaction \
                        -h "${hosts[$i]}" -p "${ports[$i]}" -U "${users[$i]}" \
                        -d "${dbs[$i]}" "${archives[$i]}"; then
            green "    ${labels[$i]} restored from ${dirs[$i]##*/}"
          else
            red "    ${labels[$i]} restore FAILED"
            exit 1
          fi
        done
        ;;
      mongodb)
        dir="$(resolve_dir mongodb)" || { red "no usable mongodb backup"; exit 1; }
        [ -n "$dir" ] || { red "resolve_dir returned an empty path for mongodb"; exit 1; }
        bson="$(find "$dir" -name '*.bson' -type f | wc -l)"
        if [ "$bson" -eq 0 ]; then
          red "mongodb dump contains no collections - nothing to restore"
          exit 1
        fi

        echo "=== mongodb ==="
        log "archive : $dir ($bson bson files)"
        log "target  : $MONGO_DB@$MONGO_HOST:$MONGO_PORT"
        check_manifest "$dir"
        tcp_wait "$MONGO_HOST" "$MONGO_PORT" mongodb || exit 1
        confirm "$MONGO_DB@$MONGO_HOST:$MONGO_PORT"

        # The dump root is passed, NOT $dir/$MONGO_DB: mongodump writes
        # <root>/<db>/<collection>.bson and mongorestore expects that same root.
        # Pointing it at the database subdirectory makes it answer "don't know what
        # to do with file ... skipping" for every file and restore nothing at all -
        # a silent no-op that looks like a successful restore.
        # --nsInclude keeps --drop inside the dumped namespace.
        if mongorestore --drop --nsInclude "$MONGO_DB.*" \
                        --host "$MONGO_HOST" --port "$MONGO_PORT" "$dir"; then
          green "    mongodb restored from ${dir##*/}"
        else
          red "    mongodb restore FAILED"
          exit 1
        fi
        ;;
      *)
        red "unknown mode: $MODE (expected postgres or mongodb)"
        exit 2
        ;;
    esac

    green "RESTORE OK"

