# Static hostPath volumes for the single-node / dev cluster.
#
# Why static PVs instead of a dynamic provisioner:
#   docker-project is deployed on one storage node, so a local directory on
#   that node is both the cheapest and the most predictable place for the
#   database files. dynamic provisioning (local-path, csi drivers) depends on
#   a provisioner that a vanilla kubeadm cluster does not ship.
#
# Matching rules - a PVC binds to a PV when storageClassName, accessModes and
# requested size all fit. Do not add `claimRef` here: the auth-postgres PVC is
# generated by the StatefulSet (`data-auth-postgres-0`) and does not exist until
# the StatefulSet is created, so a static claimRef would deadlock the binding.
#
# `hostPath.type: DirectoryOrCreate` makes kubelet create the directory if it is
# missing (mode 0755, root:root). That removes the classic "pod stuck in
# ContainerCreating" failure mode, so there is no mandatory manual mkdir step.
# Ownership is still handed to the service user by the init container - see
# infrastructure/kubernetes/scripts/preflight-storage.sh to verify it.
#
# Run `preflight-storage.sh` after `kubectl apply` to confirm binding.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-auth-pv
  labels:
    type: local
    app: auth-postgres
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  hostPath:
    path: "/mnt/data/postgres-auth"
    type: DirectoryOrCreate
---
# NOTE: there is deliberately no standalone `postgres-auth-pvc` here.
# auth-postgres.yaml declares `volumeClaimTemplates: [{name: data}]`, so the
# StatefulSet generates `data-auth-postgres-0` and binds it to the PV above.
# A hand-written PVC here would sit forever in Pending and mislead the reader.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-orders-pv
  labels:
    type: local
    app: order-mongodb
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  hostPath:
    path: "/mnt/data/mongodb-orders"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-orders-pvc
  labels:
    app: order-mongodb
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
