# Static hostPath volumes for the single-node / dev cluster.
#
# Why static PVs instead of a dynamic provisioner:
#   docker-project is deployed on one storage node, so a local directory on
#   that node is both the cheapest and the most predictable place for the
#   database files. dynamic provisioning (local-path, csi drivers) depends on
#   a provisioner that a vanilla kubeadm cluster does not ship.
#
# EVERY PV here carries an explicit `claimRef`, and the `manual` StorageClass
# uses `kubernetes.io/no-provisioner` (see storageclass-manual.yaml). Both are
# load-bearing - remove either and the cluster silently corrupts data:
#
#   The binder does not bind a claim to "its" PV, it binds it to *any* PV that
#   satisfies class + accessModes + capacity. Without claimRef, `rabbitmq-
#   messages-pvc` (5Gi) and `data-auth-postgres-0` (5Gi) both match both 5Gi
#   PVs, so the outcome is a race. Observed results: RabbitMQ mounting
#   /mnt/data/postgres-auth and writing broker state into the auth database
#   directory, while auth-postgres mounted /mnt/data/rabbitmq and wrote
#   PostgreSQL files there. Both pods report Running/Ready, so nothing fails
#   visibly - the data just lands in the wrong place.
#
#   claimRef (not `volumeName` on the PVC) is used because the two StatefulSets
#   generate their own PVCs. volumeClaimTemplates has no `volumeName` field, so
#   reserving the PV from the PV side is the only way to pin those two. The
#   claimRef is `data-<statefulset>-0`, which is deterministic.
#
# Do NOT let a claim fall through to dynamic provisioning: `no-provisioner`
# means an unmatched claim stays Pending and is visible, instead of quietly
# getting a directory nobody declared. Adding catalog-postgres to this file is
# what removed the last claim that used to fall through.
#
# No mandatory manual mkdir: `hostPath.type: DirectoryOrCreate` lets kubelet
# create the directory (mode 0755, root:root). Ownership is handed to uid 999 by
# each workload's init container - `scripts/preflight-storage.sh` verifies both
# the binding and the ownership.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-auth-pv
  labels:
    type: local
    app: auth-postgres
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: default
    name: data-auth-postgres-0
  hostPath:
    path: "/mnt/data/postgres-auth"
    type: DirectoryOrCreate
---
# Catalog database. This PV was missing entirely: catalog-postgres declares a
# 5Gi volumeClaimTemplate, and with no PV reserved for it the claim either took
# a dynamic volume or stole the RabbitMQ/auth directory depending on timing.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-catalog-pv
  labels:
    type: local
    app: catalog-postgres
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: default
    name: data-catalog-postgres-0
  hostPath:
    path: "/mnt/data/postgres-catalog"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-orders-pv
  labels:
    type: local
    app: order-mongodb
spec:
  storageClassName: manual
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: default
    name: mongodb-orders-pvc
  hostPath:
    path: "/mnt/data/mongodb-orders"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-orders-pvc
  labels:
    app: order-mongodb
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Redis for the cart. docker-compose mounts `redis_data:/data` and runs the
# server with `--appendonly yes`; without a volume the cart is lost on every pod
# restart. hostPath mirrors the compose volume so both environments behave the
# same way.
#
# Standalone PVC rather than a volumeClaimTemplate: cart-redis is a Deployment,
# not a StatefulSet, so there is no per-ordinal claim to generate.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-cart-pv
  labels:
    type: local
    app: cart-redis
spec:
  storageClassName: manual
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: default
    name: redis-cart-pvc
  hostPath:
    path: "/mnt/data/redis"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-cart-pvc
  labels:
    app: cart-redis
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# RabbitMQ broker state (queues, exchanges, and the dead letter queues that
# order-service and analytics-service publish into).
#
# This is the volume that makes the existing DLQ work meaningful. Without it a
# pod restart destroys every queue, and a message that lands in
# `orders.payment_statuses.dlq` is lost with the pod - the DLQ would appear to
# exist while providing no protection at all.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-messages-pv
  labels:
    type: local
    app: message-rabbitmq
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: default
    name: rabbitmq-messages-pvc
  hostPath:
    path: "/mnt/data/rabbitmq"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-messages-pvc
  labels:
    app: message-rabbitmq
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
