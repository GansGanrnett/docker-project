# Инфраструктурные хранилища разделены на отдельные Deployment'ы намеренно.
#
# Раньше Redis, MongoDB и RabbitMQ жили в одном поде `infra-db`. NetworkPolicy
# работает на уровне пода, поэтому для такого пода политика не может быть
# раздельной: контейнеры всё равно видят друг друга по localhost, и правило
# "order-service не ходит в Redis" технически невыполнимо. Разделение делает
# изоляцию настоящей, а не декоративной. Селекторы Service'ов обновлены
# под новые метки.
#
# Картина меток у приложений задана чартами: app.kubernetes.io/name=<service>,
# app.kubernetes.io/instance=<Release.Name>. Используем её же, чтобы
# NetworkPolicy мог адресовать клиентов.

# 1. Redis для Корзины (Node.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-redis
  namespace: default
  labels:
    app: cart-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-redis
  template:
    metadata:
      labels:
        app: cart-redis
    spec:
      containers:
        - name: cart-redis
          image: redis:7.0-alpine
          ports:
            - containerPort: 6379
              name: redis-port
---
# 2. MongoDB для Заказов (.NET 8)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-mongodb
  namespace: default
  labels:
    app: order-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-mongodb
  template:
    metadata:
      labels:
        app: order-mongodb
    spec:
      # The mongo hostPath PV is created by kubelet as root:root 0755, but the
      # official mongo image runs as uid 999 and cannot write to /data/db.
      # This init container hands the directory over, exactly like the one in
      # auth-postgres.yaml. See issue #20.
      initContainers:
        - name: init-mongo-data
          image: mongo:6.0
          command:
            - sh
            - -c
            - chown -R 999:999 /data/db
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
      containers:
        - name: order-mongodb
          image: mongo:6.0
          ports:
            - containerPort: 27017
              name: mongo-port
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongodb-orders-pvc
---
# 3. RabbitMQ Брокер для Асинхронного Pub/Sub контура
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-rabbitmq
  namespace: default
  labels:
    app: message-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-rabbitmq
  template:
    metadata:
      labels:
        app: message-rabbitmq
    spec:
      containers:
        - name: message-rabbitmq
          image: rabbitmq:3.12-management-alpine
          ports:
            - containerPort: 5672
              name: amqp-port
            - containerPort: 15672
              name: rabbitmq-mgmt
---
apiVersion: v1
kind: Service
metadata:
  name: cart-redis-service
spec:
  ports:
    - port: 6379
      targetPort: redis-port
  selector:
    app: cart-redis
---
apiVersion: v1
kind: Service
metadata:
  name: order-mongodb-service
spec:
  ports:
    - port: 27017
      targetPort: mongo-port
  selector:
    app: order-mongodb
---
apiVersion: v1
kind: Service
metadata:
  name: message-rabbitmq-service
spec:
  ports:
    - port: 5672
      targetPort: amqp-port
  selector:
    app: message-rabbitmq
