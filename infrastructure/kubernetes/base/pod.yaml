apiVersion: v1
kind: Pod
metadata:
  name: validation-pod
  namespace: default
  labels:
    app: validation
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: infra-container
    image: alpine:3.19
    command: ["sh", "-c", "echo validation"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: "100m"
        memory: "128Mi"
      requests:
        cpu: "50m"
        memory: "64Mi"
