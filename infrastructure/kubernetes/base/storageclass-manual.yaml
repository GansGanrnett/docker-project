# StorageClass referenced by storage-volumes.yaml, auth-postgres.yaml and
# catalog-postgres.yaml via `storageClassName: manual`.
#
# The name `manual` is intentional and the resource is listed first in
# kustomization/apply order: the PersistentVolumes in storage-volumes.yaml are
# bound from hostPath directories rather than dynamically provisioned, so a
# class must exist before any claim can reference it.
#
# `provisioner` is required by the API schema even for manual binding, so this
# class points at local-path. Claims that match a pre-created PersistentVolume
# (as storage-volumes.yaml does) never invoke the provisioner - it is there to
# satisfy validation, not to create volumes.
#
# Before applying, create the backing directories on every node that will host
# a database:
#   sudo mkdir -p /mnt/data/{postgres-auth,postgres-catalog,order-mongodb,redis,rabbitmq}
#   sudo chown -R 999:999 /mnt/data/postgres-auth /mnt/data/postgres-catalog
#
# `reclaimPolicy: Retain` keeps hostPath data on PVC deletion - the default
# `Delete` would orphan the directory contents and silently lose the database.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
