# StorageClass referenced by storage-volumes.yaml, auth-postgres.yaml and
# catalog-postgres.yaml via `storageClassName: manual`.
#
# `provisioner: kubernetes.io/no-provisioner` makes this a genuinely static
# class: claims are served only by the pre-created PersistentVolumes in
# storage-volumes.yaml, and a claim with no matching PV stays Pending forever.
#
# This deliberately replaces `rancher.io/local-path`. With a real provisioner,
# "manual" was a lie: any claim that did not match a static PV was silently
# given a dynamically provisioned local-path directory instead of failing. That
# is what let data end up on undocumented paths, and (combined with the missing
# claimRefs) what let RabbitMQ and auth-postgres swap directories. A loud
# Pending claim is the correct outcome - it is visible and blocks the rollout,
# whereas a dynamic volume looks healthy and put the database somewhere nobody
# expected.
#
# `volumeBindingMode: WaitForFirstConsumer` stays: the volumes are node-local
# hostPath directories, so the scheduler must pick the node before the claim is
# bound. Keep it in sync with the two StatefulSets, which rely on this class.
#
# `reclaimPolicy: Retain` keeps hostPath data on PVC deletion - the default
# `Delete` would orphan the directory contents and silently lose the database.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
