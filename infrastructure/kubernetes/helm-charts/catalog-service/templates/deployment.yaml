apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: catalog-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: RABBITMQ_URL
              value: "amqp://admin:ProdRabbitBrokerPass2026Secure99@message-rabbitmq-service:5672"
