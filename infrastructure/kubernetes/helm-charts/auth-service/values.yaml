# Значения для auth-service.
# Реальный образ приложения (а не nginx-заготовка helm create).
replicaCount: 2
image:
  repository: ghcr.io/gansganrnett/docker-project/auth-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Безопасный securityContext: не root, без эскалации привилегий
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ecommerce.local
      paths:
        - path: /
          pathType: ImplementationPrefix
  tls: []

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Реальные health-пути сервиса (не статичный /)
livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Обычные переменные окружения (не секретные)
env:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://auth-postgres-service:5432/auth_db"
  - name: SPRING_DATASOURCE_USERNAME
    value: "auth_user"
  - name: JWT_PRIVATE_KEY_PATH
    value: /app/configs/private.pem
  - name: JWT_PUBLIC_KEY_PATH
    value: /app/configs/public.pem

# Секретные переменные из Kubernetes Secret (значения не хранятся в чарте)
secretEnv:
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: spring-secrets
        key: spring-datasource-password
  - name: AUTH_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: auth-secrets
        key: auth-admin-password

# Ключевая пара RS256 для подписи JWT.
#
# Ключи НЕ в git и НЕ в образе: private.pem попадает в .gitignore, поэтому
# "просто закоммитить ключ" невозможно, а приложение без него падает на старте
# (issue #33). Отсюда и этот блок: hook-job создаёт Secret при первом
# развёртывании, Deployment монтирует его в /app/configs.
#
# Поведение при повторных upgrade намеренно консервативное: существующий Secret
# не перезаписывается никогда - перегенерация инвалидирует все выпущенные
# токены. Ротация - только ручное удаление Secret.
jwt:
  # Имя Secret с ключами.
  secretName: auth-jwt-keys
  # Куда монтируется пара в поде. Пути обязаны совпадать с JWT_*_KEY_PATH.
  mountPath: /app/configs
  # Размер ключа в битах (требование проекта - RSA-4096).
  keySize: 4096

  keygen:
    # Выключать только если Secret уже создан вручную или импортирован из
    # внешнего хранилища (Vault, External Secrets Operator).
    enabled: true

    # Одноразовый образ: в нём нет openssl и kubectl, они ставятся пакетным
    # менеджером при запуске. Требует сети из кластера на alpine-репозитории.
    # Альтернатива: собрать свой образ с обоими бинарями, указать его здесь и
    # поставить packages: [] - тогда runAsUser можно вернуть на 1000.
    image: alpine:3.19
    packages:
      - openssl
      - kubectl
    runAsUser: 0

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
