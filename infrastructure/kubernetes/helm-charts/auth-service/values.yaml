# Значения для auth-service.
# Реальный образ приложения (а не nginx-заготовка helm create).
replicaCount: 2
image:
  repository: ghcr.io/gansganrnett/docker-project/auth-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Безопасный securityContext: не root, без эскалации привилегий
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ecommerce.local
      paths:
        - path: /
          pathType: ImplementationPrefix
  tls: []

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Реальные health-пути сервиса (не статичный /)
livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Обычные переменные окружения (не секретные)
env:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://auth-postgres-service:5432/auth_db"
  - name: SPRING_DATASOURCE_USERNAME
    value: "auth_user"
  - name: JWT_PRIVATE_KEY_PATH
    value: "/app/configs/private.pem"
  - name: JWT_PUBLIC_KEY_PATH
    value: "/app/configs/public.pem"

# Секретные переменные из Kubernetes Secret (значения не хранятся в чарте)
secretEnv:
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: spring-secrets
        key: spring-datasource-password
  - name: AUTH_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: auth-secrets
        key: auth-admin-password

# Монтирование конфигов/ключей (public.pem и т.п.) из Secret или ConfigMap
configMounts: []
secretMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
