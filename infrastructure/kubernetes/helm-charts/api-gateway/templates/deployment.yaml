apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:80"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:80"
            - name: RSA_PUBLIC_KEY
              value: |
                -----BEGIN PUBLIC KEY-----
                MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmAqqQtZz8XLvBxIHieRQ
                ZWRJeksgPyF+byQU9M/pq8UZuup2dcHVohUDvWYqiMnwRMlAPBb6WipexgKwlldO
                KUnIAdwLr68Fqkm2W7HK3E0bxpTJVb2b58TRXMhxBTE4QeYkBTkdKqDr0HS/2Jyf
                Jxw7jriz6F6ff3sL9FIbPMaQw0LRVFzh/KQ3O9CKUFUJbnQ+7R5eG8LQOHpsiXVF
                Na+z2TdrDhM+kLN5EHHZ6QWn3h6vjjv1oOVjhWqGzbqgRy5DWYgEVkkLCDt5xiuU
