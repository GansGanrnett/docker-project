# Значения для payment-service.
# Реальный образ приложения (а не nginx-заготовка helm create).

# ВРЕМЕННО 1, а не 2 - см. issue #35.
#
# Идемпотентность платежей держится в обычном словаре процесса
# (app/main.py: _processed_orders) под threading.Lock. Реплики этого словарь
# не разделяют: повторный запрос по уже обработанному orderId, попавший на
# соседний под, пройдёт как новый - сервис спишет деньги второй раз и
# опубликует второе payment.completed. Идемпотентность должна быть общей,
# то есть в Redis (или БД), а не в памяти.
#
# Возврат к 2 допустим только после того, как хранилище идемпотентности
# заработает. Включать autoscaling при этом нельзя: HPA перезапишет replicas
# и вернёт ровно ту проблему, ради которой здесь стоит 1.
replicaCount: 1
image:
  repository: ghcr.io/gansganrnett/docker-project/payment-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Безопасный securityContext: не root, без эскалации привилегий
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8085

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ecommerce.local
      paths:
        - path: /
          pathType: ImplementationPrefix
  tls: []

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

# Реальные health-пути сервиса (не статичный /)
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Обычные переменные окружения (не секретные)
env:
  []

# Секретные переменные из Kubernetes Secret (значения не хранятся в чарте)
secretEnv:
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: rabbitmq-secrets
        key: rabbitmq-url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: payment-redis-url
  - name: PAYMENT_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: app-secrets
        key: payment-db-url

# Монтирование конфигов/ключей (public.pem и т.п.) из Secret или ConfigMap
configMounts: []
secretMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
