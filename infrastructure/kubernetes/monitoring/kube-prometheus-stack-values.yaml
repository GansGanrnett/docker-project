# kube-prometheus-stack values for alerting (Phase 1 monitoring)
# Install: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -f kube-prometheus-stack-values.yaml -n monitoring
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "service", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: telegram-warning
      routes:
        - receiver: telegram-critical
          matchers:
            - severity = "critical"
        - receiver: telegram-warning
          matchers:
            - severity = "warning"
    receivers:
      - name: telegram-critical
        telegram_configs:
          - bot_token_file: /etc/alertmanager/telegram/bot_token
            chat_id: <CHAT_ID>
            send_resolved: false
            parse_mode: MarkdownV2
      - name: telegram-warning
        telegram_configs:
          - bot_token_file: /etc/alertmanager/telegram/bot_token
            chat_id: <CHAT_ID>
            send_resolved: true
            parse_mode: MarkdownV2
  extraSecretMounts:
    - name: alertmanager-telegram-secret
      mountPath: "/etc/alertmanager/telegram"
      secretName: alertmanager-telegram-secret
      readOnly: true
