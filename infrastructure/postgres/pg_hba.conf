# Кастомный pg_hba.conf для postgres:15-alpine.
#
# Дефолтный образ определяет trust для local и 127.0.0.1/32, из-за чего
# любой процесс внутри контейнера (например kubectl exec) подключается к БД
# без пароля. Правила ниже требуют пароль для всех локальных подключений.
#
# Файл НЕльзя монтировать поверх /var/lib/postgresql/data/pg_hba.conf: официальный
# entrypoint дописывает свои правила в этот файл при каждом старте, и монтирование
# поверх него ломает инициализацию кластера. Вместо этого файл смонтирован в
# /etc/postgres/pg_hba.conf:ro, а postgres запускается с -c hba_file=...
#
# Порядок важен: postgres применяет первое совпавшее правило.
#
# Значения хостов и пользователей оставлены пустыми (all/all), чтобы один файл
# подходил обоим StatefulSet — auth-postgres и catalog-postgres.

# --- Локальные подключения через unix-сокет ---
local   all             all                                     scram-sha-256

# --- Локальные подключения через TCP loopback ---
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# --- Репликация: те же требования, что и для основных подключений ---
local   replication     all                                     scram-sha-256
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

# --- Внешние подключения (docker-сеть, k8s) ---
host    all             all             all                    scram-sha-256
