server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: 'prometheus,health,info'
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
      # Liveness and readiness get root-level paths so the Helm probes can
      # use the same two URLs as every other service. "server:" means the
      # main application port - there is no separate management port here.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/health"
        readiness:
          # db is the whole point of readiness for auth: the service must
          # not be sent login traffic it cannot serve. Liveness deliberately
          # omits it - a database outage must not turn into a restart loop.
          include: readinessState,db
          additional-path: "server:/ready"
  metrics:
    distribution:
      # Без этого Micrometer публикует только _count/_sum для
      # http_server_requests_seconds, и histogram_quantile в Grafana всегда
      # возвращает пусто: p95 посчитать не по чему.
      percentiles-histogram:
        http.server.requests: true

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:file:configs/private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:file:configs/public.pem}
  issuer: ecommerce-platform
  expires-in-ms: 3600000