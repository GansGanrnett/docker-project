# Конфигурация gitleaks.
#
# В репозитории нет ни одного приватного ключа, и он не должен там появляться:
# *.pem в .gitignore плюс джоб Verify JWT key bootstrap, который отдельно
# проверяет, что private.pem не отслеживается. allowlist ниже существует
# не для того, чтобы это обойти, а потому что одно правило не различает
# ключевой материал и такой же текст внутри проверки.

title = "gitleaks config for docker-project"

[[allowlists]]
description = '''
PEM-заголовки в генераторе ключей. В generate-jwt-keys.sh маркеры
"-----BEGIN PRIVATE KEY-----" и "-----BEGIN PUBLIC KEY-----" встречаются как
regex-литералы в grep -q, которыми проверяется, что формат файла именно тот,
который разбирает JwtConfig. Правило private-key видит в этой строке тот же
текст, что и в настоящем ключе, и падает.

Условие AND обязательно: оно требует совпадения и по пути, и по содержимому
строки. Поэтому правило не перестаёт работать для этого файла целиком - если
вставить в него настоящий ключ, находка останется на месте. Под allowlist
попадает только строка вида grep -q '^-----BEGIN ... KEY-----$'.
'''
condition = "AND"
paths = [
  '''helm-charts/auth-service/files/generate-jwt-keys\.sh$''',
]
regexes = [
  '''grep -q '\^-----BEGIN (RSA |EC |DSA |OPENSSH )?(PRIVATE|PUBLIC) KEY-----\$' ''',
]